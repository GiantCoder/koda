name: koda

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: koda-web-app
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=development
      # Heap size for Next dev + Turbopack; increase if you see "JavaScript heap out of memory" when compiling routes
      - NODE_OPTIONS=--max-old-space-size=1280
      - DATABASE_URL=mysql://koda:secret@mysql:3306/kodacricket
      - SHADOW_DATABASE_URL=mysql://root:rootsecret@mysql:3306/kodacricket_shadow
      - REDIS_URL=redis://redis:6379
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET_VIDEOS=koda-videos
      - STORAGE_BUCKET_ASSETS=koda-assets
      - STORAGE_PUBLIC_URL=http://localhost:9100
      - MEDIAPIPE_SERVICE_URL=http://mediapipe:8001
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - LANGFUSE_HOST=http://langfuse:3100
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - koda_network
    # Run next dev directly so container restarts don't re-run predev (prisma generate).
    # After schema changes: run `docker compose exec app npx prisma generate` then restart the app,
    # or rebuild the image so the client in the preserved node_modules volume is up to date.
    command: sh -c "npx prisma generate && npx next dev"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: koda-worker
    ports:
      - "3015:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://koda:secret@mysql:3306/kodacricket
      - SHADOW_DATABASE_URL=mysql://root:rootsecret@mysql:3306/kodacricket_shadow
      - REDIS_URL=redis://redis:6379
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - MEDIAPIPE_SERVICE_URL=http://mediapipe:8001
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - koda_network
    command: npm run worker:dev

  mediapipe:
    build:
      context: ./services/mediapipe
      dockerfile: Dockerfile
    container_name: koda-mediapipe
    ports:
      - "8101:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_COMPLEXITY=1
      - ENABLE_SEGMENTATION=false
      # Looser defaults for phone/portrait webcam; see services/mediapipe/main.py
      - MIN_DETECTION_CONFIDENCE=0.35
      - MIN_TRACKING_CONFIDENCE=0.35
      - MIN_POSE_AVG_VISIBILITY=0.32
    volumes:
      - ./services/mediapipe:/app
      - mediapipe_models:/app/models
    networks:
      - koda_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: koda-database
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: kodacricket
      MYSQL_USER: koda
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - koda_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "koda", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: koda-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - koda_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction

  minio:
    image: minio/minio:latest
    container_name: koda-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - koda_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    container_name: koda-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - koda_network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/koda-videos;
      mc mb --ignore-existing local/koda-assets;
      mc mb --ignore-existing local/koda-exports;
      mc anonymous set download local/koda-assets;
      echo 'MinIO buckets initialised';
      "

  langfuse:
    image: langfuse/langfuse:2
    container_name: koda-langfuse
    ports:
      - "3200:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: langfuse-dev-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3200
      SALT: langfuse-salt-change-in-prod
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - koda_network

  langfuse-db:
    image: postgres:15-alpine
    container_name: koda-langfuse-database
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - koda_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: koda-mailpit
    ports:
      - "8125:8025"
      - "1125:1025"
    networks:
      - koda_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  koda_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  langfuse_db_data:
  mediapipe_models:
