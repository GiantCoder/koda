<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Koda — launch film</title>
<!--
  Koda launch film. Deterministic: every frame is a pure function of time.
  Open with ?w=1080&h=1350 (4:5), ?w=1080&h=1920 (9:16) or ?w=1920&h=1080 (16:9),
  and &theme=multi (default), &theme=dark, &theme=redcream or &theme=blue.
  window.seek(seconds) draws that exact frame; render.mjs uses it to export MP4.
  Open without ?render to preview it playing in a browser.
-->
<script src="logos.js"></script>
<style>
  @font-face { font-family: Spline; src: url(fonts/SplineSans_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Spline; src: url(fonts/SplineSans_500Medium.ttf); font-weight: 500; }
  html, body { margin: 0; padding: 0; overflow: hidden; }
  #stage { position: relative; overflow: hidden; font-family: Spline, sans-serif; }
  .panel { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .icon { position: absolute; left: 0; top: 0; }
  .vis { position: absolute; }
  .vis svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .tbox { position: absolute; display: flex; align-items: center; }
  .head { position: absolute; left: 0; right: 0; font-weight: 700; letter-spacing: -0.025em; line-height: 1.06; text-wrap: balance; }
  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.1em; margin: 0 -0.04em -0.1em; }
  .w { display: inline-block; background-repeat: no-repeat; background-position: 0 0; }
  .center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { display: inline-block; font-weight: 700; letter-spacing: -0.01em; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const W = +Q.get('w') || 1080, H = +Q.get('h') || 1350;
  const THEME = Q.get('theme') || 'multi';

  // Brand tokens, taken from the Koda codebase:
  //   primaries — public/logos/*.svg (Nov 2026 logo set): red #C41E24, dark #0F0F0F, cream #FFFDD0
  //   secondaries — app/globals.css: --primary (vibrant red), --cricket-green (light + dark theme),
  //   --warning (orange), dark-theme --surface (#1A1D27); accents — playerCardThemes.ts (bronze/silver/gold).
  const C = {
    red: '#C41E24', charcoal: '#0F0F0F', cream: '#FFFDD0',
    green: '#2D6A4F', green2: '#52B788',
    orange: '#F59E0B', yellow: '#FDE047',
    vibrant: '#E63946',
    white: '#FFFFFF', blue: '#7B93B0',
    bronze: '#CD7F32', silver: '#C0C0C0', gold: '#FFD700',
    surface: '#1A1D27',
    cyan: '#2AB7CA',       // logo blue — public/logos/mode=blue.svg
  };

  // Panel roles: every colour a scene uses comes from its role, so one scene renders in any theme.
  //   fg = text + line art, hi = highlighted word, acc = joints/markers, bio = measurements,
  //   good/bad = strengths/weaknesses, card = the panel a UI visual sits on (cardFg/cardAcc inside it).
  const ROLE = {};
  ROLE.light = { bg: C.cream, fg: C.charcoal, icon: C.charcoal, iconA: 0.07, logoK: C.charcoal, logoBall: C.red,
    hi: C.red, acc: C.red, bio: C.red, good: C.green, bad: C.orange, gold: C.bronze, grid: C.blue,
    card: C.charcoal, cardFg: C.cream, cardAcc: C.vibrant, cardAccFg: C.cream, rib: [C.red, C.charcoal], pill: C.red, pillFg: C.white };
  ROLE.lightR = { ...ROLE.light, card: C.red, cardAcc: C.gold, cardAccFg: C.charcoal };
  ROLE.dark = { bg: C.charcoal, fg: C.cream, icon: C.cream, iconA: 0.06, logoK: C.cream, logoBall: C.red,
    hi: C.vibrant, acc: C.vibrant, bio: C.yellow, good: C.green2, bad: C.orange, gold: C.gold, grid: C.blue,
    card: C.surface, cardFg: C.cream, cardAcc: C.vibrant, cardAccFg: C.cream, rib: [C.red, C.cream], pill: C.red, pillFg: C.white };
  ROLE.dark2 = { ...ROLE.dark, bg: C.surface, card: C.charcoal };
  ROLE.red = { bg: C.red, fg: C.cream, icon: C.cream, iconA: 0.08, logoK: C.cream, logoBall: C.charcoal,
    hi: C.gold, acc: C.charcoal, bio: C.gold, good: C.gold, bad: C.charcoal, gold: C.gold, grid: C.cream,
    card: C.charcoal, cardFg: C.cream, cardAcc: C.vibrant, cardAccFg: C.cream, rib: [C.charcoal, C.cream], pill: C.charcoal, pillFg: C.cream };

  // Blue: logo blue panels with charcoal type (cream on cyan is too low-contrast), alternating with charcoal.
  // Highlights on blue use a cream highlighter mark (hiMark) instead of coloured text.
  ROLE.blue = { bg: C.cyan, fg: C.charcoal, icon: C.charcoal, iconA: 0.09, logoK: C.charcoal, logoBall: C.red,
    hi: C.charcoal, hiMark: C.cream, acc: C.red, bio: C.red, good: C.green, bad: C.red, gold: C.cream, grid: C.charcoal,
    card: C.charcoal, cardFg: C.cream, cardAcc: C.cyan, cardAccFg: C.charcoal, rib: [C.red, C.cream], pill: C.charcoal, pillFg: C.cream };
  ROLE.darkB = { ...ROLE.dark, hi: C.cyan, acc: C.cyan, logoK: C.cyan, logoBall: C.red, cardAcc: C.cyan, cardAccFg: C.charcoal, rib: [C.cyan, C.cream] };

  //                  hook      analysis  progress  shadow   game      credib.  end
  const THEMES = {
    multi:    ['light', 'dark',  'light', 'red',   'dark',   'red',   'light'],
    dark:     ['dark',  'dark2', 'dark',  'dark2', 'dark',   'dark2', 'dark'],
    redcream: ['lightR', 'red',  'lightR', 'red',  'lightR', 'red',   'lightR'],
    blue:     ['blue',  'darkB', 'blue',  'darkB', 'blue',   'darkB', 'blue'],
  };
  const ROLES = (THEMES[THEME] || THEMES.multi).map(k => ROLE[k]);
  document.body.style.background = ROLES[0].bg;

  // ---------- math ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, d) => clamp((t - a) / d);
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => { const c1 = 1.6, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const lerp = (a, b, p) => a + (b - a) * p;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- timeline ----------
  // Hook (thumbnail) 0–2.5 · 13 one-idea beats of 1.75s · end card from 25.25, settled ~25.75, held to 29.0
  const BEAT = 1.75, NB = 13;
  const BEATS = Array.from({ length: NB }, (_, i) => 2.5 + i * BEAT);
  const END = 2.5 + NB * BEAT;
  const DURATION = 29;
  // scene first beats: analysis 0–2, progress 3–4, shadow 5–6, gamification 7–9, credibility 10–12
  const SC = { analysis: 0, progress: 3, shadow: 5, game: 7, cred: 10 };
  const PANEL_START = [0, BEATS[0], BEATS[3], BEATS[5], BEATS[7], BEATS[10], END];
  const beatEnd = i => (i + 1 < BEATS.length ? BEATS[i + 1] : END);

  // ---------- layout ----------
  const ar = W / H, MN = Math.min(W, H);
  const L = {};
  if (ar > 1.2) {
    const mx = W * 0.07, my = H * 0.1;
    const vs = Math.min(H - 2 * my, W * 0.42);
    L.vis = { x: W - mx - vs, y: (H - vs) / 2, s: vs };
    L.text = { x: mx, y: my, w: L.vis.x - mx - W * 0.045, h: H - 2 * my, align: 'left' };
    L.fs = H * 0.083;
    L.logo = { x: mx, y: my * 0.62, s: H * 0.068 };
    L.safe = { x: mx, y: my, w: W - 2 * mx, h: H - 2 * my };
    L.heroFs = H * 0.095;
  } else {
    const tall = ar < 0.7;
    const side = W * 0.085;
    const top = tall ? H * 0.13 : H * 0.07;      // 9:16 keeps clear of Reels/Stories UI
    const bottom = tall ? H * 0.2 : H * 0.07;
    L.logo = { x: side, y: top, s: MN * 0.068 };
    const vTop = top + MN * 0.115;
    const vs = Math.min(W - 2 * side, (H - vTop - bottom) * 0.64);
    L.vis = { x: (W - vs) / 2, y: vTop, s: vs };
    const tTop = vTop + vs + MN * 0.035;
    L.text = { x: side, y: tTop, w: W - 2 * side, h: H - bottom - tTop, align: 'center' };
    L.fs = W * 0.074;
    L.safe = { x: side, y: top, w: W - 2 * side, h: H - top - bottom };
    L.heroFs = W * 0.1;
  }

  // ---------- dom helpers ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); parent && parent.appendChild(e); return e; };
  const s = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
  const txt = (parent, x, y, str, size, fill, anchor = 'start', weight = 700) => { const e = s('text', { x, y, fill, 'font-size': size, 'font-weight': weight, 'font-family': 'Spline', 'text-anchor': anchor }, parent); e.textContent = str; return e; };
  const px = v => v + 'px';

  const stage = document.getElementById('stage');
  stage.style.width = px(W); stage.style.height = px(H);

  // Logo: the new Koda artwork from public/logos (see logos.js, build-logos.mjs).
  // variant 'mark' = the K, 'koda' = K + "oda" (public/logos/koda.svg), 'lockup' = "kodacricket".
  // All share the source artboard's y 44–332; x runs 96 → 340 / 726 / 1588.
  let logoN = 0;
  const LOGO_W = { mark: 244, koda: 630, lockup: 1492 };
  function logo(parent, height, kFill, ballFill, variant = 'mark') {
    const vbW = LOGO_W[variant];
    const L0 = window.KODA_LOGO, id = 'klogo' + (logoN++);
    const body = L0.mark + (variant !== 'mark' ? L0.oda : '') + (variant === 'lockup' ? L0.cricket : '');
    const svg = s('svg', { viewBox: `96 44 ${vbW} 288`, width: height * vbW / 288, height, fill: 'none' }, parent);
    svg.innerHTML = body.replace(/%ID%/g, id).replace(/%K%/g, kFill).replace(/%A%/g, ballFill);
    const top = [...svg.children].filter(n => n.tagName === 'path');
    return { svg, ring: top[0], trail: top[1], ball: top[2] };
  }
  // Ball "drive": a small hop of the ball and trail, used as a living accent on the logo.
  function ballHop(lg, t, t0, period = 1.6) {
    const k = t > t0 ? ((t - t0) % period) / period : 0;
    const hop = k < 0.45 ? Math.sin(k / 0.45 * Math.PI) : 0;
    lg.ball.setAttribute('transform', `translate(${hop * 10} ${-hop * 14})`);
    lg.trail.setAttribute('transform', `translate(${hop * 5} ${-hop * 7})`);
  }

  // Cricket ball: one straight-on seam band (two parallel rows of stitching) — not baseball "C" curves.
  // Seam lines are gentle parallel arcs; stitches are short ticks on the outside of each line.
  function cricketBall(g, r, stroke, sw, fill) {
    s('circle', { r, fill: fill || 'none', stroke, 'stroke-width': sw }, g);
    const gap = r * 0.13, bow = r * 0.32;
    [-1, 1].forEach(side => {
      const y0 = side * gap;
      const P = u => { const x = lerp(-r, r, u); const y = y0 - bow * (1 - Math.pow(2 * u - 1, 2)); return [x, y]; };
      const pts = []; for (let i = 0; i <= 16; i++) pts.push(P(i / 16));
      // keep the seam inside the circle
      const inside = pts.filter(([x, y]) => x * x + y * y < r * r * 0.97);
      s('path', { d: 'M' + inside.map(q => q.map(v => v.toFixed(2)).join(' ')).join('L'), stroke, 'stroke-width': sw * 0.85, fill: 'none' }, g);
      for (let i = 2; i <= 14; i += 1.5) {
        const [x, y] = P(i / 16);
        if (x * x + y * y > r * r * 0.72) continue;
        const [x2, y2] = P(i / 16 + 0.01);
        let nx = -(y2 - y), ny = x2 - x; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
        if (ny * side < 0) { nx = -nx; ny = -ny; }        // point away from the seam centre
        const k = r * 0.16;
        s('path', { d: `M${x.toFixed(2)} ${y.toFixed(2)}l${(nx * k + (side * 0.25) * k).toFixed(2)} ${(ny * k).toFixed(2)}`, stroke, 'stroke-width': sw * 0.6, 'stroke-linecap': 'round' }, g);
      }
    });
    return g;
  }

  // Background cricket icons (outline).
  function iconSvg(kind, color) {
    const svg = s('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: color, 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    if (kind === 'ball') {
      const g = s('g', { transform: 'translate(12 12) rotate(-18)' }, svg);
      cricketBall(g, 9.5, color, 1.3);
    } else {
      s('path', { d: 'M12 1.5v6.5', 'stroke-width': 2.2 }, svg);
      s('rect', { x: 9.2, y: 8, width: 5.6, height: 14.5, rx: 2.4 }, svg);
      s('path', { d: 'M12 10.5v9', 'stroke-width': .8 }, svg);
    }
    return svg;
  }
  function addIcons(parent, color, opacity, n) {
    const items = [];
    for (let i = 0; i < n; i++) {
      const size = MN * lerp(0.075, 0.13, rnd());
      const d = el('div', 'icon', parent, { width: px(size), height: px(size), opacity });
      const svg = iconSvg(i % 2 ? 'bat' : 'ball', color);
      svg.setAttribute('width', size); svg.setAttribute('height', size);
      d.appendChild(svg);
      items.push({ d, x: rnd() * W, y: rnd() * H, size, ph: rnd() * 6.28, sp: lerp(.2, .45, rnd()), rot: lerp(-40, 40, rnd()), vr: lerp(-8, 8, rnd()), rise: lerp(6, 16, rnd()) * MN / 1000 });
    }
    return t => items.forEach(it => {
      const x = it.x + Math.sin(t * it.sp + it.ph) * MN * 0.02;
      const y = it.y - t * it.rise * 4 + Math.cos(t * it.sp * 1.3 + it.ph) * MN * 0.012;
      it.d.style.transform = `translate(${x - it.size / 2}px,${y - it.size / 2}px) rotate(${it.rot + t * it.vr}deg)`;
    });
  }

  // Headline: words in masks so each one rises into place. Style: { color } or { mark } (highlighter).
  const HI = R => (R.hiMark ? { mark: R.hiMark } : { color: R.hi });
  function headline(parent, words, color, fs, align) {
    const h = el('div', 'head', parent, { color, fontSize: px(fs), textAlign: align });
    const ws = [];
    words.forEach((w, i) => {
      const [text, style] = Array.isArray(w) ? w : [w, null];
      const m = el('span', 'wm', h);
      const sp = el('span', 'w', m);
      sp.textContent = text;
      if (style && style.color) sp.style.color = style.color;
      if (style && style.mark) sp.style.backgroundImage = `linear-gradient(transparent 62%, ${style.mark} 62%, ${style.mark} 94%, transparent 94%)`;
      ws.push({ sp, mark: style && style.mark });
      if (i < words.length - 1) h.appendChild(document.createTextNode(' '));
    });
    return { h, ws };
  }
  function animHeadline(hd, t, tIn, tOut) {
    hd.ws.forEach((w, i) => {
      const p = eo(prog(t, tIn + i * 0.055, 0.5));
      w.sp.style.transform = `translateY(${(1 - p) * 115}%)`;
      if (w.mark) w.sp.style.backgroundSize = `${eo(prog(t, tIn + 0.35 + i * 0.05, 0.4)) * 100}% 100%`;
    });
    const o = tOut == null ? 0 : ei(prog(t, tOut, 0.25));
    hd.h.style.opacity = 1 - o;
    hd.h.style.transform = `translateY(${-o * 0.25}em)`;
  }
  function placeHeads(box, heads) { heads.forEach(hd => { hd.h.style.top = px((box.offsetHeight - hd.h.offsetHeight) / 2); }); }

  function panel(R) { return el('div', 'panel', stage, { background: R.bg }); }
  function textBox(parent) { return el('div', 'tbox', parent, { left: px(L.text.x), top: px(L.text.y), width: px(L.text.w), height: px(L.text.h) }); }
  function visBox(parent) {
    const d = el('div', 'vis', parent, { left: px(L.vis.x), top: px(L.vis.y), width: px(L.vis.s), height: px(L.vis.s) });
    return s('svg', { viewBox: '0 0 100 100' }, d);
  }
  // Corner logo on content scenes: the "koda" wordmark (K + oda), as in public/logos/koda.svg.
  function cornerLogo(parent, R) {
    const d = el('div', '', parent, { position: 'absolute', left: px(L.logo.x), top: px(L.logo.y), lineHeight: 0 });
    return logo(d, L.logo.s, R.logoK, R.logoBall, 'koda');
  }
  // Scene scaffold: panel, floating icons, corner logo, visual box, text box, headlines for its beats.
  function scene(R, beat0, headWords) {
    const p = panel(R); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), R.icon, R.iconA, 9));
    const lg = cornerLogo(p, R);
    const v = visBox(p);
    const tb = textBox(p);
    const heads = headWords.map(ws => headline(tb, ws, R.fg, L.fs, L.text.align));
    updaters.push(t => { heads.forEach((hd, i) => animHeadline(hd, t, BEATS[beat0 + i], beatEnd(beat0 + i) - 0.4)); ballHop(lg, t, BEATS[beat0] + 0.6, 1.75); });
    updaters.push(() => placeHeads(tb, heads));
    return { p, v };
  }
  const lineDraw = (e, p) => { e.setAttribute('pathLength', 1); e.style.strokeDasharray = '1 1'; e.style.strokeDashoffset = 1 - p; };
  const tf = (e, x, y, sc = 1, r = 0) => e.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${sc})`);
  const fade = (e, o) => e.setAttribute('opacity', o);

  const updaters = [];
  const panels = [];

  // ================= P0 · HOOK (thumbnail) =================
  {
    const R = ROLES[0];
    const p = panel(R); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), R.icon, R.iconA, 9));
    const c = el('div', 'center', p, { left: px(L.safe.x), top: px(L.safe.y), width: px(L.safe.w), height: px(L.safe.h) });
    const lg = logo(c, Math.min(MN * 0.17, L.safe.w * 0.86 * 288 / 1492), R.logoK, R.logoBall, 'lockup');
    const hd = headline(el('div', '', c, { position: 'relative', marginTop: px(MN * 0.055), width: '100%', maxWidth: px(ar > 1.2 ? W * 0.62 : L.safe.w) }),
      ['Enhance', 'your', 'cricketing', 'future', 'with', ['AI.', HI(R)]], R.fg, L.heroFs, 'center');
    hd.h.style.position = 'relative';
    updaters.push(t => {
      ballHop(lg, t, 0.35, 1.5);
      c.style.transform = `scale(${1 - eio(prog(t, 2.0, 0.5)) * 0.04})`;
    });
  }

  // ================= P1 · ANALYSIS =================
  {
    const R = ROLES[1], b0 = SC.analysis;
    const { v } = scene(R, b0, [
      [['AI-powered', HI(R)], 'cricket', 'coaching'],
      ['Detailed', ['biometric', { color: R.bio }], 'analysis'],
      ['Identify', 'each', "player's", ['strengths', { color: R.good }], 'and', ['weaknesses', { color: R.bad }]],
    ]);

    const grid = s('g', { stroke: R.grid, 'stroke-width': .18 }, v);
    for (let i = 10; i < 100; i += 10) { s('line', { x1: i, y1: 2, x2: i, y2: 98 }, grid); s('line', { x1: 2, y1: i, x2: 98, y2: i }, grid); }
    const br = s('g', { stroke: R.grid, 'stroke-width': .9, fill: 'none', 'stroke-linecap': 'round' }, v);
    const brackets = ['M20 12V5h7', 'M80 12V5h-7', 'M20 88v7h7', 'M80 88v7h-7'].map(d => s('path', { d }, br));

    const J = { head: [50, 14], neck: [50, 23], shF: [44.5, 26.5], shB: [56, 27.5], elF: [40.5, 37.5], elB: [59.5, 37], wrF: [49, 46], wrB: [51.5, 44.5],
      hip: [50, 52], hipF: [46, 53], hipB: [55, 52.5], knF: [38.5, 68], knB: [61, 68], anF: [41, 85], anB: [59.5, 85] };
    const fig = s('g', {}, v);
    const batH = s('line', { x1: 50.3, y1: 45, x2: 52.6, y2: 56, stroke: R.fg, 'stroke-width': 1.7, 'stroke-linecap': 'round' }, fig);
    const batB = s('line', { x1: 52.6, y1: 56.5, x2: 57.2, y2: 86, stroke: C.bronze, 'stroke-width': 5, 'stroke-linecap': 'round' }, fig);
    const BONES = [['neck', 'shF'], ['neck', 'shB'], ['shF', 'elF'], ['elF', 'wrF'], ['shB', 'elB'], ['elB', 'wrB'], ['neck', 'hip'], ['hip', 'hipF'], ['hip', 'hipB'], ['hipF', 'knF'], ['knF', 'anF'], ['hipB', 'knB'], ['knB', 'anB']];
    const bones = BONES.map(([a, b]) => s('path', { d: `M${J[a]}L${J[b]}`, stroke: R.fg, 'stroke-width': 1.5, 'stroke-linecap': 'round', fill: 'none' }, fig));
    const headC = s('circle', { cx: J.head[0], cy: J.head[1], r: 5, stroke: R.fg, 'stroke-width': 1.5, fill: 'none' }, fig);
    const joints = ['shF', 'shB', 'elF', 'elB', 'wrF', 'hipF', 'hipB', 'knF', 'knB', 'anF', 'anB'].map(k => {
      const g = s('g', {}, fig);
      const ring = s('circle', { r: 3.2, fill: R.acc, opacity: .25 }, g);
      s('circle', { r: 1.9, fill: R.acc }, g);
      return { g, ring, k };
    });
    const scan = s('g', {}, v);
    s('rect', { x: 6, y: -8, width: 88, height: 8, fill: R.acc, opacity: .12 }, scan);
    s('line', { x1: 6, y1: 0, x2: 94, y2: 0, stroke: R.acc, 'stroke-width': .5 }, scan);

    s('circle', { r: 6.5, fill: A }, shareBtn);
    const sg = s('g', { stroke: AF, 'stroke-width': .9, fill: AF }, shareBtn);
    s('path', { d: 'M-2.2 0L2 -2.6M-2.2 0L2 2.6', fill: 'none' }, sg);
    [[-2.2, 0], [2, -2.6], [2, 2.6]].forEach(([x, y]) => s('circle', { cx: x, cy: y, r: 1.2, stroke: 'none' }, sg));
    const FR = [[82, 24], [86, 48], [80, 72]];
    const friends = FR.map(([x, y], i) => {
      const g = s('g', {}, share);
      const ln = s('line', { x1: 68, y1: 48, x2: x, y2: y, stroke: F, 'stroke-opacity': .3, 'stroke-width': .5, 'stroke-dasharray': '1.2 1.2' }, share);
      share.insertBefore(ln, shareBtn);
      s('circle', { r: 5, fill: [C.green2, C.orange, C.blue][i] }, g);
      const heart = s('path', { d: 'M0 2.2C-3.2 0 -3 -2.4 -1.5 -2.4C-0.7 -2.4 0 -1.6 0 -1.2C0 -1.6 0.7 -2.4 1.5 -2.4C3 -2.4 3.2 0 0 2.2Z', fill: C.white }, g);
      return { g, ln, x, y, i };
    });

    // (b) private league table
    const league = s('g', {}, card);
    const lock = s('g', { transform: 'translate(14 17)', stroke: F, 'stroke-width': .9, fill: 'none' }, league);
    s('rect', { x: -2.6, y: -1, width: 5.2, height: 4.2, rx: .8, fill: A, stroke: 'none' }, lock);
    s('path', { d: 'M-1.6 -1v-1.4a1.6 1.6 0 0 1 3.2 0V-1' }, lock);
    txt(league, 19.5, 18.6, 'Private league', 4.4, F);
    const NAMES = [[.8, .92], [.6, .78], [.7, .66], [null, .6], [.5, .44]];   // [name bar width, points bar]; null = You
    const lRows = NAMES.map(([nw, pts], i) => {
      const g = s('g', {}, league);
      const you = nw == null;
      const bg = s('rect', { x: 18, y: -4.4, width: 72, height: 8.8, rx: 2.4, fill: you ? A : F, 'fill-opacity': you ? 1 : .06 }, g);
      s('circle', { cx: 24, cy: 0, r: 2.8, fill: you ? AF : [C.green2, C.orange, C.blue, null, C.silver][i] }, g);
      if (you) txt(g, 29.5, 1.5, 'You', 4.2, AF);
      else s('rect', { x: 29.5, y: -1.2, width: 22 * nw, height: 2.4, rx: 1.2, fill: F, 'fill-opacity': .55 }, g);
      const pbar = s('rect', { x: 60, y: -1.4, width: 26 * pts, height: 2.8, rx: 1.4, fill: you ? AF : F, 'fill-opacity': you ? .9 : .3 }, g);
      return { g, you, pbar, pts, i };
    });
    const ranks = [1, 2, 3, 4, 5].map(n => txt(league, 12.5, 30 + (n - 1) * 12 + 1.6, String(n), 4.4, F, 'middle'));
    const crown = s('path', { d: 'M-4 2L-4.6 -3L-1.8 -0.6L0 -3.8L1.8 -0.6L4.6 -3L4 2Z', fill: C.gold }, league);

    // (c) collection of best-shot clips
    const coll = s('g', {}, card);
    const folder = s('g', {}, coll);
    s('path', { d: 'M18 34h20l4 5h40a3 3 0 0 1 3 3v38a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V37a3 3 0 0 1 3-3Z', fill: F, 'fill-opacity': .08, stroke: F, 'stroke-opacity': .3, 'stroke-width': .5 }, folder);
    txt(folder, 50, 91, 'Best shots', 4.6, F, 'middle');
    const clips = [0, 1, 2, 3].map(i => {
      const g = s('g', {}, coll);
      s('rect', { x: -15, y: -9.5, width: 30, height: 19, rx: 2.4, fill: R.card, stroke: F, 'stroke-opacity': .45, 'stroke-width': .5 }, g);
      s('rect', { x: -15, y: -9.5, width: 30, height: 19, rx: 2.4, fill: F, 'fill-opacity': .1 }, g);
      s('path', { d: 'M-2 -3.2L3.4 0L-2 3.2Z', fill: F }, g);
      const st = s('path', { d: 'M0 -2.4L.7 -.8L2.4 -.7L1.1 .4L1.5 2.1L0 1.2L-1.5 2.1L-1.1 .4L-2.4 -.7L-.7 -.8Z', fill: C.gold, transform: 'translate(11 -5.6)' }, g);
      return { g, i };
    });
    const SLOT = [[36, 52, -8], [64, 52, 7], [36, 70, 5], [64, 70, -6]];

    const T0 = BEATS[b0];
    updaters.push(t => {
      const u = t - T0;
      card.setAttribute('transform', `translate(50 50) scale(${0.9 + 0.1 * back(prog(u, 0, 0.5))}) translate(-50 -50)`);
      fade(card, clamp(prog(u, -0.05, 0.25)));
      const segOut = (a) => 1 - eio(prog(u, a, 0.25));
      // share
      fade(share, segOut(1.55));
      lineDraw(sp, eo(prog(u, 0.2, 0.7)));
      tf(pb, 42, 72, back(prog(u, 0.75, 0.35)));
      tf(shareBtn, 68, 48, back(prog(u, 0.55, 0.35)));
      friends.forEach(f => {
        const fp = eo(prog(u, 0.85 + f.i * 0.1, 0.4));
        tf(f.g, lerp(68, f.x, fp), lerp(48, f.y, fp), back(prog(u, 0.85 + f.i * 0.1, 0.4)) * (1 + 0.12 * Math.sin(Math.max(0, u - 1.3) * 8 + f.i)));
        fade(f.g, prog(u, 0.85 + f.i * 0.1, 0.1));
        lineDraw(f.ln, fp);
      });
      // league
      const lIn = eo(prog(u, 1.75, 0.35));
      fade(league, lIn * segOut(3.3));
      const climb = eio(prog(u, 2.35, 0.75));
      lRows.forEach(r => {
        let slot = r.i;
        if (r.you) slot = lerp(3, 0, climb);
        else if (r.i < 3) slot = r.i + climb;                   // the three above slide down one place
        const rin = eo(prog(u, 1.8 + r.i * 0.06, 0.35));
        r.g.setAttribute('transform', `translate(${(1 - rin) * 10} ${30 + slot * 12})`);
        fade(r.g, rin);
        if (r.you) r.pbar.setAttribute('width', 26 * lerp(r.pts, 0.97, climb));
      });
      ranks.forEach((rk, i) => fade(rk, eo(prog(u, 1.8 + i * 0.06, 0.35))));
      tf(crown, 24, 30 - 6.4, back(prog(u, 3.05, 0.3)));
      // collection
      const cIn = eo(prog(u, 3.5, 0.3));
      fade(coll, cIn);
      clips.forEach(c => {
        const cp = eo(prog(u, 3.6 + c.i * 0.13, 0.5));
        const [sx, sy, sr] = SLOT[c.i];
        const settle = Math.sin(Math.max(0, u - 4.4) * 3 + c.i) * 0.6;
        tf(c.g, lerp(110, sx, cp), lerp(12, sy, cp) + settle, 0.85 + 0.15 * cp, lerp(25, sr, cp));
        fade(c.g, prog(u, 3.6 + c.i * 0.13, 0.1));
      });
    });
  }

  // ================= P5 · CREDIBILITY =================
  {
    const R = ROLES[5], b0 = SC.cred;
    const { v } = scene(R, b0, [
      [['ECB-level', HI(R)], 'coaching', 'advice'],
      ['Trained', 'on', ['1000s', HI(R)], 'of', 'professional', 'cricket', 'videos'],
      ['Built', 'on', ['years', HI(R)], 'of', 'sports', 'coaching', 'experience'],
    ]);
    const medalsG = s('g', {}, v);
    function medal(cx, cy, r, col, dark, star) {
      const g = s('g', {}, medalsG);
      s('path', { d: `M${-r * .55} ${-r * 2.3}L${-r * .55 + r * .6} ${-r * 2.3}L${r * .25} ${-r * .6}L${-r * .25} ${-r * .6}Z`, fill: R.rib[0] }, g);
      s('path', { d: `M${r * .55} ${-r * 2.3}L${r * .55 - r * .6} ${-r * 2.3}L${-r * .25} ${-r * .6}L${r * .25} ${-r * .6}Z`, fill: R.rib[1] }, g);
      s('circle', { r, fill: col }, g);
      s('circle', { r: r * .76, fill: 'none', stroke: dark, 'stroke-width': r * .07 }, g);
      if (star) {
        const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .22 : r * .5; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
        s('polygon', { points: pts.join(' '), fill: dark }, g);
      } else s('circle', { r: r * .22, fill: dark }, g);
      const id = 'mc' + col.slice(1);
      const clip = s('clipPath', { id }, g); s('circle', { r }, clip);
      const shine = s('rect', { x: -r * .25, y: -r * 1.2, width: r * .22, height: r * 2.4, fill: C.white, opacity: .45, transform: 'rotate(25)', 'clip-path': `url(#${id})` }, g);
      return { g, shine, cx, cy, r };
    }
    const medals = [medal(25, 64, 11, C.bronze, '#8B4513', false), medal(75, 64, 11, C.silver, '#7A7A7A', false), medal(50, 56, 15.5, C.gold, '#B8860B', true)];
    const delays = [0.15, 0.3, 0.47];

    const wall = s('g', {}, v);
    const tiles = [];
    const COLS = 6, ROWSN = 6, TW = 13, TH = 8.6, G = 2.4;
    const x0 = 50 - (COLS * TW + (COLS - 1) * G) / 2, y0 = 50 - (ROWSN * TH + (ROWSN - 1) * G) / 2;
    for (let r = 0; r < ROWSN; r++) for (let c = 0; c < COLS + 2; c++) {
      const g = s('g', {}, wall);
      s('rect', { x: -TW / 2, y: -TH / 2, width: TW, height: TH, rx: 1.4, fill: R.card, 'fill-opacity': .55, stroke: R.fg, 'stroke-opacity': .25, 'stroke-width': .3 }, g);
      s('path', { d: 'M-1.3 -2L2.2 0L-1.3 2Z', fill: R.fg }, g);
      const hl = s('rect', { x: -TW / 2, y: -TH / 2, width: TW, height: TH, rx: 1.4, fill: 'none', stroke: C.gold, 'stroke-width': .6, opacity: 0 }, g);
      tiles.push({ g, hl, r, c: c - 1, seedv: rnd() });
    }
    const wallMask = s('clipPath', { id: 'wallclip' }, s('defs', {}, v));
    s('rect', { x: 2, y: 2, width: 96, height: 96, rx: 6 }, wallMask);
    wall.setAttribute('clip-path', 'url(#wallclip)');

    const yearsG = s('g', {}, v);
    const rings = [0, 1, 2, 3].map(() => s('circle', { cx: 50, cy: 50, fill: 'none', stroke: C.gold, 'stroke-width': .55 }, yearsG));
    const lgWrap = s('g', {}, yearsG);
    s('circle', { cx: 50, cy: 50, r: 21, fill: R.fg, opacity: .08 }, lgWrap);
    const lgInner = logo(s('g', { transform: 'translate(37.3 35)' }, lgWrap), 30, R.logoK, R.logoBall);

    const T0 = BEATS[b0];
    updaters.push(t => {
      const u = t - T0;
      const mOut = eio(prog(u, 1.5, 0.3));
      medals.forEach((m, i) => {
        const bob = Math.sin((u - delays[i]) * 2.2 + i) * .8 * prog(u, delays[i] + .4, .3);
        tf(m.g, m.cx, m.cy + (1 - eo(prog(u, delays[i], 0.45))) * 14 + bob, back(prog(u, delays[i], 0.45)) * (1 - mOut * .3));
        fade(m.g, clamp(prog(u, delays[i], .15)) * (1 - mOut));
        m.shine.setAttribute('x', lerp(-m.r * 2, m.r * 2, prog(u, 0.75 + i * 0.12, 0.5)) - m.r * .11);
      });
      const conv = eio(prog(u, 3.45, 0.55));
      tiles.forEach(tl => {
        const st = 1.75 + (tl.r + Math.max(0, tl.c)) * 0.035;
        const dir = tl.r % 2 ? 1 : -1;
        const scroll = ((u - 1.75) * 6 * dir) % (TW + G);
        let x = x0 + TW / 2 + tl.c * (TW + G) + scroll;
        let y = y0 + TH / 2 + tl.r * (TH + G);
        x = lerp(x, 50, conv); y = lerp(y, 50, conv);
        tf(tl.g, x, y, back(prog(u, st, 0.4)) * (1 - conv));
        fade(tl.g, clamp(prog(u, st, .12)) * (1 - conv));
        fade(tl.hl, u > 2.35 && Math.sin(t * 1.7 + tl.seedv * 20) > 0.93 ? 1 : 0);
      });
      lgWrap.setAttribute('transform', `translate(50 50) scale(${back(prog(u, 3.7, 0.5))}) translate(-50 -50)`);
      fade(lgWrap, clamp(prog(u, 3.7, .15)));
      ballHop(lgInner, u, 4.05, 1.28);
      rings.forEach((r, i) => {
        const k = u - 3.95 - i * 0.32;
        const q = k > 0 ? (k % 1.28) / 1.28 : 0;
        r.setAttribute('r', 22 + 26 * q);
        fade(r, k > 0 ? (1 - q) * .9 : 0);
      });
    });
  }

  // ================= P6 · END CARD =================
  {
    const R = ROLES[6];
    const p = panel(R); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), R.icon, R.iconA, 9));
    const c = el('div', 'center', p, { left: px(L.safe.x), top: px(L.safe.y), width: px(L.safe.w), height: px(L.safe.h) });
    const lgD = el('div', '', c);
    const lg = logo(lgD, Math.min(MN * 0.14, L.safe.w * 0.75 * 288 / 1492), R.logoK, R.logoBall, 'lockup');
    const hWrap = el('div', '', c, { position: 'relative', marginTop: px(MN * 0.05), width: '100%' });
    const hd = headline(hWrap, ['Sign-up', 'for', 'a', 'free', 'account:'], R.fg, L.heroFs * 0.9, 'center');
    hd.h.style.position = 'relative';
    const pill = el('div', 'pill', c, { marginTop: px(MN * 0.045), background: R.pill, color: R.pillFg, fontSize: px(L.heroFs * 0.8), padding: `${L.heroFs * 0.22}px ${L.heroFs * 0.6}px` });
    pill.textContent = 'kodacricket.com';
    updaters.push(t => {
      const lp = eo(prog(t, END + 0.05, 0.4));
      lgD.style.transform = `translateY(${(1 - lp) * MN * 0.03}px) scale(${0.88 + 0.12 * lp})`;
      lgD.style.opacity = lp;
      ballHop(lg, t, END + 0.6, 1.5);
      animHeadline(hd, t, END + 0.1, null);
      pill.style.transform = `scale(${back(prog(t, END + 0.22, 0.28))})`;
      pill.style.opacity = clamp(prog(t, END + 0.22, .1));
    });
  }

  // ---------- scene wipes: a circle grows from the centre of the visual ----------
  const RAD = Math.hypot(W, H);
  function wipes(t) {
    panels.forEach((p, k) => {
      if (k === 0) return;
      const q = eio(prog(t, PANEL_START[k] - 0.22, 0.5));
      p.style.clipPath = `circle(${q * RAD}px at ${L.vis.x + L.vis.s / 2}px ${L.vis.y + L.vis.s / 2}px)`;
      p.style.visibility = q > 0 ? 'visible' : 'hidden';
    });
    panels.forEach((p, k) => { if (k + 1 < panels.length && t > PANEL_START[k + 1] + 0.3) p.style.visibility = 'hidden'; });
  }

  function seek(t) {
    t = clamp(t, 0, DURATION);
    updaters.forEach(u => u(t));
    wipes(t);
  }
  window.seek = seek;
  window.DURATION = DURATION;

  document.fonts.ready.then(() => {
    seek(0);
    window.__ready = true;
    if (!Q.has('render')) {
      const t0 = performance.now();
      const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  });
})();
</script>
</body>
</html>
