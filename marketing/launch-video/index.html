<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Koda — 20s launch film</title>
<!--
  Koda launch film. Deterministic: every frame is a pure function of time.
  Open with ?w=1080&h=1350 (4:5), ?w=1080&h=1920 (9:16) or ?w=1920&h=1080 (16:9).
  window.seek(seconds) draws that exact frame; render.mjs uses it to export MP4.
  Open without ?render to preview it playing in a browser.
-->
<script src="logos.js"></script>
<style>
  @font-face { font-family: Spline; src: url(fonts/SplineSans_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Spline; src: url(fonts/SplineSans_500Medium.ttf); font-weight: 500; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFDD0; }
  #stage { position: relative; overflow: hidden; font-family: Spline, sans-serif; }
  .panel { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .icon { position: absolute; left: 0; top: 0; }
  .vis { position: absolute; }
  .vis svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .tbox { position: absolute; display: flex; align-items: center; }
  .head { position: absolute; left: 0; right: 0; font-weight: 700; letter-spacing: -0.025em; line-height: 1.06; text-wrap: balance; }
  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.1em; margin: 0 -0.04em -0.1em; }
  .w { display: inline-block; background-repeat: no-repeat; background-position: 0 0; }
  .center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { display: inline-block; font-weight: 700; letter-spacing: -0.01em; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const W = +Q.get('w') || 1080, H = +Q.get('h') || 1350;
  const DURATION = 20;

  // Brand tokens, taken from the Koda codebase:
  //   primaries — public/logos/*.svg (Nov 2026 logo set): red #C41E24, dark #0F0F0F, cream #FFFDD0
  //   secondaries — app/globals.css: --primary (vibrant red), --cricket-green (light + dark theme),
  //   --warning (orange); accents — app/components/player-card/playerCardThemes.ts (bronze/silver/gold).
  const C = {
    red: '#C41E24',        // logo red — primary
    charcoal: '#0F0F0F',   // logo dark — primary
    cream: '#FFFDD0',      // logo cream — primary
    green: '#2D6A4F', green2: '#52B788',
    orange: '#F59E0B', yellow: '#FDE047',
    vibrant: '#E63946',    // web --primary — secondary "vibrant red"
    white: '#FFFFFF', blue: '#7B93B0',
    bronze: '#CD7F32', silver: '#C0C0C0', gold: '#FFD700',
  };

  // ---------- math ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, d) => clamp((t - a) / d);
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => { const c1 = 1.6, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const lerp = (a, b, p) => a + (b - a) * p;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- timeline ----------
  // Hook (thumbnail) 0–2.5 · 8 one-idea beats of 1.75s · end card settled at 17.0, held to 20.0
  const BEATS = [2.5, 4.25, 6.0, 7.75, 9.5, 11.25, 13.0, 14.75];
  const END = 16.5;
  const PANEL_START = [0, 2.5, 7.75, 11.25, END];
  const beatEnd = i => (i + 1 < BEATS.length ? BEATS[i + 1] : END);

  // ---------- layout ----------
  const ar = W / H, MN = Math.min(W, H);
  const L = {};
  if (ar > 1.2) {
    const mx = W * 0.07, my = H * 0.1;
    const vs = Math.min(H - 2 * my, W * 0.42);
    L.vis = { x: W - mx - vs, y: (H - vs) / 2, s: vs };
    L.text = { x: mx, y: my, w: L.vis.x - mx - W * 0.045, h: H - 2 * my, align: 'left' };
    L.fs = H * 0.083;
    L.logo = { x: mx, y: my * 0.62, s: H * 0.075 };
    L.safe = { x: mx, y: my, w: W - 2 * mx, h: H - 2 * my };
    L.heroFs = H * 0.095;
  } else {
    const tall = ar < 0.7;
    const side = W * 0.085;
    const top = tall ? H * 0.13 : H * 0.07;      // 9:16 keeps clear of Reels/Stories UI
    const bottom = tall ? H * 0.2 : H * 0.07;
    L.logo = { x: side, y: top, s: MN * 0.075 };
    const vTop = top + MN * 0.115;
    const vs = Math.min(W - 2 * side, (H - vTop - bottom) * 0.64);
    L.vis = { x: (W - vs) / 2, y: vTop, s: vs };
    const tTop = vTop + vs + MN * 0.035;
    L.text = { x: side, y: tTop, w: W - 2 * side, h: H - bottom - tTop, align: 'center' };
    L.fs = W * 0.074;
    L.safe = { x: side, y: top, w: W - 2 * side, h: H - top - bottom };
    L.heroFs = W * 0.1;
  }

  // ---------- dom helpers ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); parent && parent.appendChild(e); return e; };
  const s = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
  const px = v => v + 'px';

  const stage = document.getElementById('stage');
  stage.style.width = px(W); stage.style.height = px(H);

  // Logo: the new Koda lockup / mark from public/logos (see logos.js, build-logos.mjs).
  // Mark spans x 96–340, lockup x 96–1588, both y 44–332 in the source 376-high artboard.
  let logoN = 0;
  function logo(parent, height, kFill, ballFill, variant = 'mark') {
    const vbW = variant === 'lockup' ? 1492 : 244;
    const L0 = window.KODA_LOGO, id = 'klogo' + (logoN++);
    const body = L0.mark + (variant === 'lockup' ? L0.oda + L0.cricket : '');
    const svg = s('svg', { viewBox: `96 44 ${vbW} 288`, width: height * vbW / 288, height, fill: 'none' }, parent);
    svg.innerHTML = body.replace(/%ID%/g, id).replace(/%K%/g, kFill).replace(/%A%/g, ballFill);
    const top = [...svg.children].filter(n => n.tagName === 'path');
    return { svg, ring: top[0], trail: top[1], ball: top[2] };
  }
  // Ball "drive": a small hop of the ball and trail, used as a living accent on the mark.
  function ballHop(lg, t, t0, period = 1.6) {
    const k = t > t0 ? ((t - t0) % period) / period : 0;
    const hop = Math.sin(Math.min(1, k / 0.45) * Math.PI) * (k < 0.45 ? 1 : 0);
    lg.ball.setAttribute('transform', `translate(${hop * 10} ${-hop * 14})`);
    lg.trail.setAttribute('transform', `translate(${hop * 5} ${-hop * 7})`);
  }

  // Background cricket icons (outline). Ball with seam; bat with handle + blade.
  function iconSvg(kind, color) {
    const svg = s('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: color, 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    if (kind === 'ball') {
      s('circle', { cx: 12, cy: 12, r: 9.5 }, svg);
      s('path', { d: 'M7 4.2c2.6 4.7 2.6 10.9 0 15.6M17 4.2c-2.6 4.7-2.6 10.9 0 15.6' }, svg);
      s('path', { d: 'M8.6 7.5l1.2-.4M8.9 12l1.3 0M8.6 16.5l1.2.4M15.4 7.5l-1.2-.4M15.1 12l-1.3 0M15.4 16.5l-1.2.4', 'stroke-width': .9 }, svg);
    } else {
      s('path', { d: 'M12 1.5v6.5' , 'stroke-width': 2.2 }, svg);
      s('rect', { x: 9.2, y: 8, width: 5.6, height: 14.5, rx: 2.4 }, svg);
      s('path', { d: 'M12 10.5v9', 'stroke-width': .8 }, svg);
    }
    return svg;
  }
  function addIcons(parent, color, opacity, n, avoid) {
    const items = [];
    for (let i = 0; i < n; i++) {
      const size = MN * lerp(0.075, 0.13, rnd());
      const d = el('div', 'icon', parent, { width: px(size), height: px(size), opacity });
      const svg = iconSvg(i % 2 ? 'bat' : 'ball', color);
      svg.setAttribute('width', size); svg.setAttribute('height', size);
      d.appendChild(svg);
      items.push({ d, x: rnd() * W, y: rnd() * H, size, ph: rnd() * 6.28, sp: lerp(.2, .45, rnd()), rot: lerp(-40, 40, rnd()), vr: lerp(-8, 8, rnd()), rise: lerp(6, 16, rnd()) * MN / 1000 });
    }
    return t => items.forEach(it => {
      const x = it.x + Math.sin(t * it.sp + it.ph) * MN * 0.02;
      const y = it.y - t * it.rise * 4 + Math.cos(t * it.sp * 1.3 + it.ph) * MN * 0.012;
      it.d.style.transform = `translate(${x - it.size / 2}px,${y - it.size / 2}px) rotate(${it.rot + t * it.vr}deg)`;
    });
  }

  // Headline: words in masks so each one rises into place.
  function headline(parent, words, color, fs, align) {
    const h = el('div', 'head', parent, { color, fontSize: px(fs), textAlign: align });
    const ws = [];
    words.forEach((w, i) => {
      const [text, style] = Array.isArray(w) ? w : [w, null];
      const m = el('span', 'wm', h);
      const sp = el('span', 'w', m);
      sp.textContent = text;
      if (style && style.color) sp.style.color = style.color;
      if (style && style.mark) sp.style.backgroundImage = `linear-gradient(transparent 62%, ${style.mark} 62%, ${style.mark} 94%, transparent 94%)`;
      ws.push({ sp, mark: style && style.mark });
      if (i < words.length - 1) h.appendChild(document.createTextNode(' '));
    });
    return { h, ws };
  }
  function animHeadline(hd, t, tIn, tOut) {
    hd.ws.forEach((w, i) => {
      const p = eo(prog(t, tIn + i * 0.055, 0.5));
      w.sp.style.transform = `translateY(${(1 - p) * 115}%)`;
      if (w.mark) w.sp.style.backgroundSize = `${eo(prog(t, tIn + 0.35 + i * 0.05, 0.4)) * 100}% 100%`;
    });
    const o = tOut == null ? 0 : ei(prog(t, tOut, 0.25));
    hd.h.style.opacity = 1 - o;
    hd.h.style.transform = `translateY(${-o * 0.25}em)`;
  }
  // Vertically centre a headline within its text box (it is absolutely positioned so beats can overlap).
  function placeHeads(box, heads) { heads.forEach(hd => { hd.h.style.top = px((box.offsetHeight - hd.h.offsetHeight) / 2); }); }

  function panel(bg) { return el('div', 'panel', stage, { background: bg }); }
  function textBox(parent) { return el('div', 'tbox', parent, { left: px(L.text.x), top: px(L.text.y), width: px(L.text.w), height: px(L.text.h) }); }
  function visBox(parent) {
    const d = el('div', 'vis', parent, { left: px(L.vis.x), top: px(L.vis.y), width: px(L.vis.s), height: px(L.vis.s) });
    return s('svg', { viewBox: '0 0 100 100' }, d);
  }
  function cornerLogo(parent, k, dot) {
    const d = el('div', '', parent, { position: 'absolute', left: px(L.logo.x), top: px(L.logo.y), lineHeight: 0 });
    logo(d, L.logo.s * 1.15, k, dot);
    return d;
  }
  const lineDraw = (e, p) => { e.setAttribute('pathLength', 1); e.style.strokeDasharray = '1 1'; e.style.strokeDashoffset = 1 - p; };
  const tf = (e, x, y, sc = 1, r = 0) => e.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${sc})`);

  const updaters = [];
  const panels = [];

  // ================= P0 · HOOK (thumbnail) =================
  {
    const p = panel(C.cream); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), C.charcoal, 0.07, 9));
    const c = el('div', 'center', p, { left: px(L.safe.x), top: px(L.safe.y), width: px(L.safe.w), height: px(L.safe.h) });
    const lg = logo(c, Math.min(MN * 0.17, L.safe.w * 0.86 * 288 / 1492), C.charcoal, C.red, 'lockup');
    const hd = headline(el('div', '', c, { position: 'relative', marginTop: px(MN * 0.055), width: '100%', maxWidth: px(ar > 1.2 ? W * 0.62 : L.safe.w) }),
      ['Enhance', 'your', 'cricketing', 'future', 'with', ['AI.', { color: C.red }]], C.charcoal, L.heroFs, 'center');
    hd.h.style.position = 'relative';
    updaters.push(t => {
      ballHop(lg, t, 0.35, 1.5);
      const drift = eio(prog(t, 2.0, 0.5));
      c.style.transform = `scale(${1 - drift * 0.04})`;
    });
  }

  // ================= P1 · ANALYSIS (charcoal) =================
  {
    const p = panel(C.charcoal); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), C.cream, 0.06, 9));
    cornerLogo(p, C.cream, C.vibrant);
    const v = visBox(p);
    const tb = textBox(p);
    const heads = [
      headline(tb, [['AI-powered', { color: C.vibrant }], 'cricket', 'coaching'], C.cream, L.fs, L.text.align),
      headline(tb, ['Detailed', ['biometric', { color: C.yellow }], 'analysis'], C.cream, L.fs, L.text.align),
      headline(tb, ['Identify', 'each', "player's", ['strengths', { color: C.green2 }], 'and', ['weaknesses', { color: C.orange }]], C.cream, L.fs, L.text.align),
    ];

    // tracking grid + brackets
    const grid = s('g', { stroke: C.blue, 'stroke-width': .18 }, v);
    for (let i = 10; i < 100; i += 10) { s('line', { x1: i, y1: 2, x2: i, y2: 98 }, grid); s('line', { x1: 2, y1: i, x2: 98, y2: i }, grid); }
    const br = s('g', { stroke: C.blue, 'stroke-width': .9, fill: 'none', 'stroke-linecap': 'round' }, v);
    const brackets = [['M20 12V5h7'], ['M80 12V5h-7'], ['M20 88v7h7'], ['M80 88v7h-7']].map(([d]) => s('path', { d }, br));

    // batter, side-on stance
    const J = { head: [50, 14], neck: [50, 23], shF: [44.5, 26.5], shB: [56, 27.5], elF: [40.5, 37.5], elB: [59.5, 37], wrF: [49, 46], wrB: [51.5, 44.5],
      hip: [50, 52], hipF: [46, 53], hipB: [55, 52.5], knF: [38.5, 68], knB: [61, 68], anF: [41, 85], anB: [59.5, 85] };
    const fig = s('g', {}, v);
    const bat = s('g', { 'stroke-linecap': 'round' }, fig);
    const batH = s('line', { x1: 50.3, y1: 45, x2: 52.6, y2: 56, stroke: C.cream, 'stroke-width': 1.7 }, bat);
    const batB = s('line', { x1: 52.6, y1: 56.5, x2: 57.2, y2: 86, stroke: C.bronze, 'stroke-width': 5 }, bat);
    const BONES = [['neck', 'shF'], ['neck', 'shB'], ['shF', 'elF'], ['elF', 'wrF'], ['shB', 'elB'], ['elB', 'wrB'], ['neck', 'hip'], ['hip', 'hipF'], ['hip', 'hipB'], ['hipF', 'knF'], ['knF', 'anF'], ['hipB', 'knB'], ['knB', 'anB']];
    const bones = BONES.map(([a, b]) => s('path', { d: `M${J[a]}L${J[b]}`, stroke: C.cream, 'stroke-width': 1.5, 'stroke-linecap': 'round', fill: 'none' }, fig));
    const headC = s('circle', { cx: J.head[0], cy: J.head[1], r: 5, stroke: C.cream, 'stroke-width': 1.5, fill: 'none' }, fig);
    const JOINTS = ['shF', 'shB', 'elF', 'elB', 'wrF', 'hipF', 'hipB', 'knF', 'knB', 'anF', 'anB'];
    const joints = JOINTS.map(k => {
      const g = s('g', {}, fig);
      const ring = s('circle', { cx: 0, cy: 0, r: 3.2, fill: C.vibrant, opacity: .25 }, g);
      s('circle', { cx: 0, cy: 0, r: 1.9, fill: C.vibrant }, g);
      return { g, ring, k };
    });
    // scan line
    const scan = s('g', {}, v);
    s('rect', { x: 6, y: -8, width: 88, height: 8, fill: C.vibrant, opacity: .12 }, scan);
    s('line', { x1: 6, y1: 0, x2: 94, y2: 0, stroke: C.vibrant, 'stroke-width': .5 }, scan);

    // biometric angles — values are the real angles of the drawn pose
    const ang = (a, o, b) => { const v1 = [J[a][0] - J[o][0], J[a][1] - J[o][1]], v2 = [J[b][0] - J[o][0], J[b][1] - J[o][1]];
      return Math.acos((v1[0] * v2[0] + v1[1] * v2[1]) / Math.hypot(...v1) / Math.hypot(...v2)) * 180 / Math.PI; };
    function angleMark(a, o, b, labelDx, labelDy) {
      const g = s('g', {}, v);
      const [ox, oy] = J[o], r = 5.5;
      const a1 = Math.atan2(J[a][1] - oy, J[a][0] - ox), a2 = Math.atan2(J[b][1] - oy, J[b][0] - ox);
      let da = a2 - a1; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      const arc = s('path', { d: `M${ox + r * Math.cos(a1)} ${oy + r * Math.sin(a1)}A${r} ${r} 0 0 ${da > 0 ? 1 : 0} ${ox + r * Math.cos(a2)} ${oy + r * Math.sin(a2)}`, stroke: C.yellow, 'stroke-width': .9, fill: 'none' }, g);
      const label = s('text', { x: ox + labelDx, y: oy + labelDy, fill: C.yellow, 'font-size': 5, 'font-weight': 700, 'font-family': 'Spline', 'text-anchor': 'middle' }, g);
      return { g, arc, label, val: Math.round(ang(a, o, b)) };
    }
    const angles = [angleMark('shB', 'elB', 'wrB', 11, 2), angleMark('hipF', 'knF', 'anF', -10, 2), angleMark('hipB', 'knB', 'anB', 10, 2)];
    const stride = s('g', { stroke: C.blue, 'stroke-width': .7 }, v);
    const strideL = s('line', { x1: J.anF[0], y1: 92, x2: J.anB[0], y2: 92 }, stride);
    s('line', { x1: J.anF[0], y1: 90, x2: J.anF[0], y2: 94 }, stride); s('line', { x1: J.anB[0], y1: 90, x2: J.anB[0], y2: 94 }, stride);

    // strengths / weaknesses radar
    const radar = s('g', {}, v);
    const RC = [50, 50], RR = 36, VALS = [0.92, 0.68, 0.5, 0.86, 0.34, 0.7];
    const pt = (i, r) => { const a = (-90 + i * 60) * Math.PI / 180; return [RC[0] + Math.cos(a) * r, RC[1] + Math.sin(a) * r]; };
    [1, .66, .33].forEach(k => s('polygon', { points: [0, 1, 2, 3, 4, 5].map(i => pt(i, RR * k)).join(' '), fill: 'none', stroke: C.cream, 'stroke-opacity': .2, 'stroke-width': .35 }, radar));
    for (let i = 0; i < 6; i++) s('line', { x1: RC[0], y1: RC[1], x2: pt(i, RR)[0], y2: pt(i, RR)[1], stroke: C.cream, 'stroke-opacity': .2, 'stroke-width': .35 }, radar);
    const poly = s('polygon', { fill: C.green2, 'fill-opacity': .35, stroke: C.green2, 'stroke-width': 1, 'stroke-linejoin': 'round' }, radar);
    const vdots = VALS.map((vv, i) => {
      const strong = vv > 0.8, weak = vv < 0.4;
      const col = strong ? C.green2 : weak ? C.orange : C.cream;
      const g = s('g', {}, radar);
      const ring = s('circle', { r: 4, fill: 'none', stroke: col, 'stroke-width': .7 }, g);
      s('circle', { r: strong || weak ? 2.2 : 1.4, fill: col }, g);
      let sym = null;
      if (strong || weak) {
        sym = s('g', { stroke: col, 'stroke-width': 1.3, 'stroke-linecap': 'round' }, radar);
        s('line', { x1: -2, y1: 0, x2: 2, y2: 0 }, sym);
        if (strong) s('line', { x1: 0, y1: -2, x2: 0, y2: 2 }, sym);
      }
      return { g, ring, sym, i, vv, emph: strong || weak };
    });

    updaters.push(t => {
      // heads
      heads.forEach((hd, i) => animHeadline(hd, t, BEATS[i], beatEnd(i) - 0.4));
      // grid + brackets
      const figOut = eio(prog(t, 5.95, 0.4));
      grid.setAttribute('opacity', (eo(prog(t, 2.55, 0.5)) * (1 - figOut * .6)) * .5);
      brackets.forEach((b, i) => lineDraw(b, eo(prog(t, 2.7 + i * 0.05, 0.4))));
      br.setAttribute('opacity', 1 - figOut);
      // figure
      bones.forEach((b, i) => lineDraw(b, eo(prog(t, 2.75 + i * 0.03, 0.35))));
      lineDraw(headC, eo(prog(t, 2.7, 0.4)));
      const bp = eo(prog(t, 3.05, 0.4));
      batH.setAttribute('opacity', bp); batB.setAttribute('opacity', bp);
      joints.forEach((j, i) => {
        const pop = back(prog(t, 2.6 + i * 0.045, 0.35));
        const pulse = t > 4.25 ? 1 + 0.5 * Math.max(0, Math.sin((t - 4.25 - i * 0.07) * 4)) : 1;
        tf(j.g, J[j.k][0], J[j.k][1], pop);
        j.ring.setAttribute('r', 3.2 * pulse);
      });
      fig.setAttribute('opacity', 1 - figOut);
      fig.setAttribute('transform', `translate(50 50) scale(${1 - figOut * .15}) translate(-50 -50)`);
      // scan sweeps
      const sw1 = prog(t, 2.85, 1.2), sw2 = prog(t, 4.35, 1.2);
      const sw = t < 4.3 ? sw1 : sw2;
      scan.setAttribute('transform', `translate(0 ${6 + 88 * eio(sw)})`);
      scan.setAttribute('opacity', Math.sin(sw * Math.PI) * (1 - figOut));
      // angles
      angles.forEach((a, i) => {
        const ap = eo(prog(t, 4.45 + i * 0.15, 0.5));
        lineDraw(a.arc, ap);
        a.label.textContent = Math.round(a.val * ap) + '°';
        a.g.setAttribute('opacity', ap * (1 - figOut));
      });
      lineDraw(strideL, eo(prog(t, 4.9, 0.45)));
      stride.setAttribute('opacity', prog(t, 4.9, 0.1) * (1 - figOut));
      // radar
      const rIn = eo(prog(t, 6.1, 0.45)), grow = eo(prog(t, 6.25, 0.7));
      const rOut = 0; // scene ends with the wipe
      radar.setAttribute('opacity', rIn);
      radar.setAttribute('transform', `translate(50 50) scale(${0.85 + 0.15 * rIn}) rotate(${(1 - rIn) * -20}) translate(-50 -50)`);
      poly.setAttribute('points', VALS.map((vv, i) => pt(i, RR * vv * grow)).join(' '));
      vdots.forEach(d => {
        const [x, y] = pt(d.i, RR * d.vv * grow);
        tf(d.g, x, y, 1);
        const pp = d.emph ? back(prog(t, 6.75 + d.i * 0.05, 0.35)) : 1;
        const pulse = d.emph ? (t - 7) % 0.9 / 0.9 : 0;
        d.ring.setAttribute('r', d.emph ? 2.5 + 4 * clamp(pulse) : 0);
        d.ring.setAttribute('opacity', d.emph && t > 7 ? 1 - clamp(pulse) : 0);
        d.g.setAttribute('opacity', grow);
        if (d.sym) { const [sx, sy] = pt(d.i, RR * d.vv * grow + 7.5); tf(d.sym, sx, sy, pp); }
      });
    });
    updaters.push(() => placeHeads(tb, heads));
  }

  // ================= P2 · PROGRESS (cream) =================
  {
    const p = panel(C.cream); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), C.charcoal, 0.07, 9));
    cornerLogo(p, C.charcoal, C.red);
    const v = visBox(p);
    const tb = textBox(p);
    const heads = [
      headline(tb, ['Track', 'your', ['progress', { color: C.red }], 'over', 'time'], C.charcoal, L.fs, L.text.align),
      headline(tb, ['Track', 'improvements', 'in', ['batting,', { mark: C.green2 }], ['bowling', { mark: C.orange }], 'and', ['fielding', { mark: C.yellow }]], C.charcoal, L.fs, L.text.align),
    ];
    const card = s('g', {}, v);
    s('rect', { x: 3, y: 5, width: 94, height: 90, rx: 6, fill: C.charcoal }, card);

    // chart
    const chart = s('g', {}, card);
    [30, 50, 70].forEach(y => s('line', { x1: 12, y1: y, x2: 88, y2: y, stroke: C.cream, 'stroke-opacity': .1, 'stroke-width': .35 }, chart));
    s('line', { x1: 12, y1: 82, x2: 88, y2: 82, stroke: C.cream, 'stroke-opacity': .35, 'stroke-width': .45 }, chart);
    const YS = [72, 65, 68, 58, 60, 49, 43, 33, 22];
    const P = YS.map((y, i) => [12 + i * 9.5, y]);
    const dLine = 'M' + P.map(q => q.join(' ')).join('L');
    const defs = s('defs', {}, v);
    const cp = s('clipPath', { id: 'reveal' }, defs);
    const cpr = s('rect', { x: 10, y: 0, width: 0, height: 100 }, cp);
    const grad = s('linearGradient', { id: 'area', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    s('stop', { offset: 0, 'stop-color': C.vibrant, 'stop-opacity': .45 }, grad);
    s('stop', { offset: 1, 'stop-color': C.vibrant, 'stop-opacity': 0 }, grad);
    s('path', { d: dLine + 'L88 82L12 82Z', fill: 'url(#area)', 'clip-path': 'url(#reveal)' }, chart);
    const line = s('path', { d: dLine, stroke: C.vibrant, 'stroke-width': 1.6, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, chart);
    const cdots = P.map(([x, y], i) => s('circle', { cx: x, cy: y, r: i === P.length - 1 ? 2.3 : 1.3, fill: i === P.length - 1 ? C.gold : C.cream }, chart));
    const goldRing = s('circle', { cx: P[8][0], cy: P[8][1], r: 3, fill: 'none', stroke: C.gold, 'stroke-width': .7 }, chart);
    const arrow = s('path', { d: 'M0 3L0 -3M-2.6 -0.6L0 -3.2L2.6 -0.6', stroke: C.gold, 'stroke-width': 1.1, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, chart);

    // discipline rows
    function rowIcon(kind, parent) {
      const g = s('g', { fill: 'none', stroke: C.cream, 'stroke-width': 1.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
      if (kind === 'bat') { s('path', { d: 'M-4.5 -4.5L-2.2 -2.2', 'stroke-width': 1.8 }, g); s('rect', { x: -1.6, y: -2.6, width: 3.6, height: 10, rx: 1.5, transform: 'rotate(-45)' }, g); }
      if (kind === 'ball') { s('circle', { r: 5, fill: C.vibrant, stroke: 'none' }, g); s('path', { d: 'M-2.4 -4.3c1.6 2.7 1.6 5.9 0 8.6M2.4 -4.3c-1.6 2.7-1.6 5.9 0 8.6', 'stroke-width': .6, 'stroke-dasharray': '.9 .6' }, g); }
      if (kind === 'glove') { s('path', { d: 'M-4.2 0.5V-2.5a1.05 1.05 0 0 1 2.1 0V-4.2a1.05 1.05 0 0 1 2.1 0V-4.6a1.05 1.05 0 0 1 2.1 0V-3.8a1.05 1.05 0 0 1 2.1 0V1.2a4.2 4.2 0 0 1-4.2 4.2h-.6a3.6 3.6 0 0 1-3.6-3.6Z' }, g); s('circle', { cx: 4.3, cy: -6.2, r: 1.5, fill: C.vibrant, stroke: 'none' }, g); }
      return g;
    }
    const ROWS = [['bat', C.green2, 0.42, 0.86], ['ball', C.orange, 0.36, 0.76], ['glove', C.yellow, 0.48, 0.9]];
    const rowsG = s('g', {}, card);
    const rows = ROWS.map(([kind, col, before, after], i) => {
      const y = 27 + i * 23;
      const g = s('g', {}, rowsG);
      const ic = rowIcon(kind, g); ic.setAttribute('transform', `translate(16 ${y})`);
      s('rect', { x: 27, y: y - 4, width: 60, height: 8, rx: 4, fill: C.cream, 'fill-opacity': .1 }, g);
      const was = s('rect', { x: 27, y: y - 4, height: 8, rx: 4, fill: C.cream, 'fill-opacity': .28 }, g);
      const bar = s('rect', { x: 27, y: y - 4, height: 8, rx: 4, fill: col }, g);
      const chev = s('path', { d: 'M-2.2 1.2L0 -1.2L2.2 1.2', stroke: col, 'stroke-width': 1.2, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      return { g, was, bar, chev, before, after, y, i };
    });

    updaters.push(t => {
      heads.forEach((hd, i) => animHeadline(hd, t, BEATS[3 + i], beatEnd(3 + i) - 0.4));
      const cIn = back(prog(t, 7.75, 0.5));
      card.setAttribute('transform', `translate(50 50) scale(${0.9 + 0.1 * cIn}) translate(-50 -50)`);
      card.setAttribute('opacity', clamp(prog(t, 7.7, 0.25)));
      const lp = eio(prog(t, 8.0, 1.15));
      lineDraw(line, lp);
      cpr.setAttribute('width', lp * 78);
      cdots.forEach((d, i) => d.setAttribute('opacity', prog(lp, i / 8 - 0.02, 0.04)));
      const gp = (t - 9.1);
      goldRing.setAttribute('r', 2.3 + 5 * clamp((gp % 0.8) / 0.8));
      goldRing.setAttribute('opacity', gp > 0 ? 1 - clamp((gp % 0.8) / 0.8) : 0);
      const ap = back(prog(t, 9.05, 0.35));
      arrow.setAttribute('transform', `translate(${P[8][0]} ${P[8][1] - 7 - 1.5 * Math.sin(Math.max(0, t - 9.4) * 5)}) scale(${ap})`);
      const chartOut = eio(prog(t, 9.3, 0.3));
      chart.setAttribute('opacity', 1 - chartOut);
      chart.setAttribute('transform', `translate(0 ${-chartOut * 6})`);
      rows.forEach(r => {
        const rin = eo(prog(t, 9.5 + r.i * 0.1, 0.4));
        r.g.setAttribute('opacity', rin);
        r.g.setAttribute('transform', `translate(0 ${(1 - rin) * 5})`);
        const w1 = eo(prog(t, 9.6 + r.i * 0.1, 0.35)) * r.before * 60;
        const w2 = lerp(r.before, r.after, eio(prog(t, 10.05 + r.i * 0.12, 0.7))) * 60 * eo(prog(t, 9.6 + r.i * 0.1, 0.35));
        r.was.setAttribute('width', Math.max(8, w1));
        r.bar.setAttribute('width', Math.max(8, w2));
        r.bar.setAttribute('opacity', prog(t, 9.6 + r.i * .1, .1));
        const cp2 = back(prog(t, 10.6 + r.i * 0.12, 0.3));
        r.chev.setAttribute('transform', `translate(${27 + w2 + 4} ${r.y - Math.sin(Math.max(0, t - 10.9) * 6 + r.i) * .8}) scale(${cp2})`);
      });
    });
    updaters.push(() => placeHeads(tb, heads));
  }

  // ================= P3 · CREDIBILITY (red) =================
  {
    const p = panel(C.red); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), C.cream, 0.08, 9));
    cornerLogo(p, C.cream, C.charcoal);
    const v = visBox(p);
    const tb = textBox(p);
    const heads = [
      headline(tb, [['ECB-level', { color: C.gold }], 'coaching', 'advice'], C.cream, L.fs, L.text.align),
      headline(tb, ['Trained', 'on', ['1000s', { color: C.gold }], 'of', 'professional', 'cricket', 'videos'], C.cream, L.fs, L.text.align),
      headline(tb, ['Built', 'on', ['years', { color: C.gold }], 'of', 'sports', 'coaching', 'experience'], C.cream, L.fs, L.text.align),
    ];

    // medals — Koda's bronze / silver / gold tiers
    const medalsG = s('g', {}, v);
    function medal(cx, cy, r, col, dark, star) {
      const g = s('g', {}, medalsG);
      const rib = s('g', {}, g);
      s('path', { d: `M${-r * .55} ${-r * 2.3}L${-r * .55 + r * .6} ${-r * 2.3}L${r * .25} ${-r * .6}L${-r * .25} ${-r * .6}Z`, fill: C.charcoal }, rib);
      s('path', { d: `M${r * .55} ${-r * 2.3}L${r * .55 - r * .6} ${-r * 2.3}L${-r * .25} ${-r * .6}L${r * .25} ${-r * .6}Z`, fill: C.cream }, rib);
      s('circle', { r, fill: col }, g);
      s('circle', { r: r * .76, fill: 'none', stroke: dark, 'stroke-width': r * .07 }, g);
      if (star) {
        const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .22 : r * .5; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
        s('polygon', { points: pts.join(' '), fill: dark }, g);
      } else {
        s('circle', { r: r * .22, fill: dark }, g);
      }
      const shine = s('rect', { x: -r * .25, y: -r * 1.2, width: r * .22, height: r * 2.4, fill: C.white, opacity: .45, transform: 'rotate(25)' }, g);
      const clip = s('clipPath', { id: 'mc' + col.slice(1) }, g); s('circle', { r }, clip);
      shine.setAttribute('clip-path', `url(#mc${col.slice(1)})`);
      return { g, shine, cx, cy, r };
    }
    const medals = [medal(25, 64, 11, C.bronze, '#8B4513', false), medal(75, 64, 11, C.silver, '#7A7A7A', false), medal(50, 56, 15.5, C.gold, '#B8860B', true)];
    const delays = [11.4, 11.55, 11.72];

    // video wall
    const wall = s('g', {}, v);
    const tiles = [];
    const COLS = 6, ROWSN = 6, TW = 13, TH = 8.6, G = 2.4;
    const x0 = 50 - (COLS * TW + (COLS - 1) * G) / 2, y0 = 50 - (ROWSN * TH + (ROWSN - 1) * G) / 2;
    for (let r = 0; r < ROWSN; r++) for (let c = 0; c < COLS + 2; c++) {
      const g = s('g', {}, wall);
      s('rect', { x: -TW / 2, y: -TH / 2, width: TW, height: TH, rx: 1.4, fill: C.charcoal, 'fill-opacity': .55, stroke: C.cream, 'stroke-opacity': .25, 'stroke-width': .3 }, g);
      s('path', { d: 'M-1.3 -2L2.2 0L-1.3 2Z', fill: C.cream }, g);
      const hl = s('rect', { x: -TW / 2, y: -TH / 2, width: TW, height: TH, rx: 1.4, fill: 'none', stroke: C.gold, 'stroke-width': .6, opacity: 0 }, g);
      tiles.push({ g, hl, r, c: c - 1, seedv: rnd() });
    }
    const wallMask = s('clipPath', { id: 'wallclip' }, s('defs', {}, v));
    s('rect', { x: 2, y: 2, width: 96, height: 96, rx: 6 }, wallMask);
    wall.setAttribute('clip-path', 'url(#wallclip)');

    // logo + year rings
    const yearsG = s('g', {}, v);
    const rings = [0, 1, 2, 3].map(() => s('circle', { cx: 50, cy: 50, fill: 'none', stroke: C.gold, 'stroke-width': .55 }, yearsG));
    const lgWrap = s('g', {}, yearsG);
    s('circle', { cx: 50, cy: 50, r: 21, fill: C.cream, opacity: .08 }, lgWrap);
    const lgG = s('g', { transform: 'translate(37.3 35)' }, lgWrap);
    const lgInner = logo(lgG, 30, C.cream, C.charcoal);

    updaters.push(t => {
      heads.forEach((hd, i) => animHeadline(hd, t, BEATS[5 + i], beatEnd(5 + i) - 0.4));
      const mOut = eio(prog(t, 12.75, 0.3));
      medals.forEach((m, i) => {
        const pp = back(prog(t, delays[i], 0.45));
        const bob = Math.sin((t - delays[i]) * 2.2 + i) * .8 * prog(t, delays[i] + .4, .3);
        tf(m.g, m.cx, m.cy + (1 - eo(prog(t, delays[i], 0.45))) * 14 + bob, pp * (1 - mOut * .3));
        m.g.setAttribute('opacity', clamp(prog(t, delays[i], .15)) * (1 - mOut));
        const sh = prog(t, 12.0 + i * 0.12, 0.5);
        m.shine.setAttribute('x', lerp(-m.r * 2, m.r * 2, sh) - m.r * .11);
      });
      // wall: rows scroll in alternating directions
      const conv = eio(prog(t, 14.7, 0.55));
      tiles.forEach(tl => {
        const pin = back(prog(t, 13.0 + (tl.r + Math.max(0, tl.c)) * 0.035, 0.4));
        const dir = tl.r % 2 ? 1 : -1;
        const scroll = ((t - 13) * 6 * dir) % (TW + G);
        let x = x0 + TW / 2 + tl.c * (TW + G) + scroll + (dir > 0 ? -(TW + G) : 0) + (TW + G) * (dir > 0 ? 1 : 0);
        let y = y0 + TH / 2 + tl.r * (TH + G);
        x = lerp(x, 50, conv); y = lerp(y, 50, conv);
        tf(tl.g, x, y, pin * (1 - conv));
        tl.g.setAttribute('opacity', clamp(prog(t, 13.0 + (tl.r + Math.max(0, tl.c)) * 0.035, .12)) * (1 - conv));
        const flick = Math.sin((t * 1.7 + tl.seedv * 20)) > 0.93 ? 1 : 0;
        tl.hl.setAttribute('opacity', t > 13.6 ? flick : 0);
      });
      const lp = back(prog(t, 14.95, 0.5));
      lgWrap.setAttribute('transform', `translate(50 50) scale(${lp}) translate(-50 -50)`);
      lgWrap.setAttribute('opacity', clamp(prog(t, 14.95, .15)));
      ballHop(lgInner, t, 15.3, 1.28);
      rings.forEach((r, i) => {
        const k = (t - 15.2 - i * 0.32);
        const q = k > 0 ? (k % 1.28) / 1.28 : 0;
        r.setAttribute('r', 22 + 26 * q);
        r.setAttribute('opacity', k > 0 ? (1 - q) * .9 : 0);
      });
    });
    updaters.push(() => placeHeads(tb, heads));
  }

  // ================= P4 · END CARD (cream) =================
  let endParts;
  {
    const p = panel(C.cream); panels.push(p);
    updaters.push(addIcons(el('div', 'layer', p), C.charcoal, 0.07, 9));
    const c = el('div', 'center', p, { left: px(L.safe.x), top: px(L.safe.y), width: px(L.safe.w), height: px(L.safe.h) });
    const lgD = el('div', '', c);
    const lg = logo(lgD, Math.min(MN * 0.14, L.safe.w * 0.75 * 288 / 1492), C.charcoal, C.red, 'lockup');
    const hWrap = el('div', '', c, { position: 'relative', marginTop: px(MN * 0.05), width: '100%' });
    const hd = headline(hWrap, ['Sign-up', 'for', 'a', 'free', 'account:'], C.charcoal, L.heroFs * 0.9, 'center');
    hd.h.style.position = 'relative';
    const pill = el('div', 'pill', c, { marginTop: px(MN * 0.045), background: C.red, color: C.white, fontSize: px(L.heroFs * 0.8), padding: `${L.heroFs * 0.22}px ${L.heroFs * 0.6}px` });
    pill.textContent = 'kodacricket.com';
    updaters.push(t => {
      const lp = eo(prog(t, END + 0.05, 0.4));
      lgD.style.transform = `translateY(${(1 - lp) * MN * 0.03}px) scale(${0.88 + 0.12 * lp})`;
      lgD.style.opacity = lp;
      ballHop(lg, t, END + 0.6, 1.5);
      animHeadline(hd, t, END + 0.1, null);
      const pp = back(prog(t, END + 0.22, 0.28));
      pill.style.transform = `scale(${pp})`;
      pill.style.opacity = clamp(prog(t, END + 0.22, .1));
    });
  }

  // ---------- scene wipes: a circle grows from the centre of the visual ----------
  const R = Math.hypot(W, H);
  function wipes(t) {
    panels.forEach((p, k) => {
      if (k === 0) return;
      const st = PANEL_START[k];
      const q = eio(prog(t, st - 0.22, 0.5));
      const cx = L.vis.x + L.vis.s / 2, cy = L.vis.y + L.vis.s / 2;
      p.style.clipPath = `circle(${q * R}px at ${cx}px ${cy}px)`;
      p.style.visibility = q > 0 ? 'visible' : 'hidden';
    });
    // panels fully covered by a later one are hidden
    panels.forEach((p, k) => { if (k + 1 < panels.length && t > PANEL_START[k + 1] + 0.3) p.style.visibility = 'hidden'; });
  }

  function seek(t) {
    t = clamp(t, 0, DURATION);
    updaters.forEach(u => u(t));
    wipes(t);
  }
  window.seek = seek;
  window.DURATION = DURATION;

  document.fonts.ready.then(() => {
    seek(0);
    window.__ready = true;
    if (!Q.has('render')) {
      const t0 = performance.now();
      const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  });
})();
</script>
</body>
